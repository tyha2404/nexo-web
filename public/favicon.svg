<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="chevron-main" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a5b4fc" />
    </linearGradient>
    <linearGradient id="chevron-back" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>
  </defs>

  <!-- Rounded container -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#bg)" />

  <!-- Back chevron (subtle layer) -->
  <path d="M36 80 L60 46 L84 80" stroke="url(#chevron-back)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.35" />

  <!-- Front chevron (bold) -->
  <path d="M28 72 L60 30 L92 72" stroke="url(#chevron-main)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
