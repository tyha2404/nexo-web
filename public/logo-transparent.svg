<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3794ff" />
      <stop offset="1" stop-color="#0058a8" />
    </linearGradient>
    <clipPath id="tile"><rect x="4" y="4" width="112" height="112" rx="26" /></clipPath>
    <!-- Mark: terminal prompt + rising bars -->
    <g id="mark">
      <path d="M26 38 L48 60 L26 82" fill="none" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="58" y="66" width="12" height="17" rx="3" />
      <rect x="74" y="53" width="12" height="30" rx="3" />
      <rect x="90" y="37" width="12" height="46" rx="3" />
    </g>
  </defs>
  <g clip-path="url(#tile)">
