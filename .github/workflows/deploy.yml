name: Deploy Nexo Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-web:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Environment
        shell: bash
        run: |
          echo "=== Deploy Info ==="
          echo "User: $(whoami)"
          echo "Node: $(node -v)"
          echo "PM2: $(pm2 -v)"

      - name: Install Dependencies
        shell: bash
        run: |
          npm ci

      - name: Build Web App (Vite)
        shell: bash
        run: |
          npm run build

      - name: Deploy / Reload PM2
        shell: bash
        run: |
          pm2 reload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs
          pm2 save
