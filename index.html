<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20261103c" />
    <link rel="alternate icon" type="image/png" href="/icon-192.png?v=20261103c" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20261103c" />
    <!-- iPhone 14 Pro / 15 / 15 Pro / 16 (393x852 @3x) launch screens -->
    <link
      rel="apple-touch-startup-image"
      href="/splash-1179x2556.png?v=20261103c"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash-1179x2556-light.png?v=20261103c"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "black-translucent": the web view runs edge to edge under the status bar (layouts pad
         with env(safe-area-inset-top)). "default" made iOS 26 place a web view one status-bar
         height (59px) short of the screen bottom, leaving a blank strip under full-screen
         sheets and the bottom nav. The status text is always white, so StatusBarBacking paints
         a dark strip behind it in the light theme. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nexo" />
    <meta name="theme-color" content="#181818" />
    <title>Nexo Portal - Quản lý Tài chính Cá nhân</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
